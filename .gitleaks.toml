# Gitleaks configuration for Swiftpayments.
# https://github.com/gitleaks/gitleaks

title = "Swiftpayments secret scan"

[extend]
useDefault = true

[[allowlist]]
description = "Lockfiles and generated artifacts"
paths = [
  "bun.lock",
  "package-lock.json",
  "pnpm-lock.yaml",
  "yarn.lock",
]

[[allowlist]]
description = "Test fixtures may contain fake provider keys"
regexes = [
  "sk_test_fake_",
  "pk_test_fake_",
  "test_only_",
]
